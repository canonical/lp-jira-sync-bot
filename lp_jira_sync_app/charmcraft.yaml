# yaml
name: lp-jira-sync-bot
type: charm

title: Launchpad JIRA Sync Bot
summary: FastAPI webhook service that syncs Launchpad issues/events to JIRA.
description: |
  A FastAPI-based webhook service that validates Launchpad webhook requests,
  constructs a JIRA client, and synchronizes Launchpad events to JIRA
  according to a provided project configuration.

# The bases define the build/run environment for the charm artifact.
base: ubuntu@24.04
platforms:
  amd64:
  #arm64:
  # ppc64el:
  # s390x:
# Parts define how to build the charm artifact.
parts:
  charm:
    plugin: charm
    source: .

# OCI image resource produced by Rockcraft (or provided from a registry).
resources:
  lp-jira-sync-bot:
    type: oci-image
    description: OCI image for the Launchpad ↔ JIRA Sync Bot, built with Rockcraft.

# Configuration options exposed by the charm to operators.
config:

  options:
    external-hostname:
      description: |
        The external hostname to use. Will default to the name of the deployed
        application.
      default: ""
      type: string

    port:
      default: 8000
      type: int

    launchpad_webhook_secret_code:
      type: string
      default: ""
      description: |
        Secret token used to verify incoming Launchpad webhook requests.
        Set this to a strong, secret value and configure the same value in the Launchpad webhook.

    launchpad_url:
      type: string
      default: "https://launchpad.net"
      description: Base URL for Launchpad API/webhooks.

    jira_instance:
      type: string
      default: "Jira instance URL"
      description: Base URL of the target JIRA/Atlassian Cloud instance (e.g., https://your-domain.atlassian.net).

    jira_username:
      type: string
      default: "Jira username"
      description: JIRA user/email used for authentication.

    jira_token:
      type: string
      default: "Jira API token"
      description: JIRA API token used for authentication. Consider storing this securely via your deployment tooling.

containers:
  lp-jira-sync-bot:
    resource: lp-jira-sync-bot

requires:
  nginx-route:
    interface: nginx-route